<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin:0;
      overflow:hidden;
      font-family:sans-serif;
    }

    #ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 12px;
      color: white;
      text-align: center;
      z-index: 10;
    }

    #scaleSlider {
      width: 100%;
    }

    #back {
      position:absolute;
      top:20px;
      left:20px;
      padding:10px 14px;
      border-radius:10px;
      border:none;
      background:#222;
      color:white;
      font-weight:bold;
      z-index:10;
    }
  </style>
</head>

<body>

<button id="back" onclick="history.back()">← Back</button>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <a-entity
      id="treeModel"
      scale="1 1 1"
      rotation="0 0 0">
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <div id="treeName">Loading...</div>

  <label for="scaleSlider">Scale</label>
  <input
    type="range"
    id="scaleSlider"
    min="0.2"
    max="3"
    step="0.1"
    value="1"
  />
</div>

<script>

/* ---------------- GET MODEL FROM URL ---------------- */

const params = new URLSearchParams(window.location.search);
const modelId = params.get("model") || "elm";

/* ---------------- MODEL REGISTRY ---------------- */

const MODEL_MAP = {
  elm: {
    name: "Elm Tree",
    path: "/tree_elm.glb"
  },
  shrub: {
    name: "Shrub",
    path: "/treeShrub.glb"
  }
};

/* ---------------- LOAD MODEL ---------------- */

const selected = MODEL_MAP[modelId] || MODEL_MAP.elm;

const treeEntity = document.getElementById("treeModel");
treeEntity.setAttribute("gltf-model", selected.path);

document.getElementById("treeName").innerText = selected.name;

/* ---------------- SCALE SLIDER ---------------- */

const slider = document.getElementById("scaleSlider");

slider.addEventListener("input", (e) => {
  const scale = e.target.value;
  treeEntity.setAttribute("scale", `${scale} ${scale} ${scale}`);
});

</script>

</body>
</html>
